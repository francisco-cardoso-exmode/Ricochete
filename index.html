<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>RICOCHETE v0.1</title><style>*{box-sizing:border-box;touch-action:none}html,body{margin:0;height:100%;overflow:hidden;background:#0d0f12;color:white;font-family:system-ui,-apple-system}canvas{width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 16px) 18px}.brand{font-weight:900;letter-spacing:.16em}.sub{font-size:9px;opacity:.55;letter-spacing:.15em}.balls{position:absolute;right:18px;top:calc(env(safe-area-inset-top) + 18px);font-weight:800}.tip{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;opacity:.65}.ctl{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);height:48px;border:1px solid #ffffff18;background:#17191ed9;border-radius:15px;display:flex;gap:9px;align-items:center;padding:0 12px;backdrop-filter:blur(15px)}.ctl label{font-size:9px;font-weight:900;letter-spacing:.12em;opacity:.6}.ctl input{flex:1}.ctl b{font-size:11px;width:34px}button{border:0;border-radius:9px;height:29px;font-weight:800}.win{display:none;position:fixed;inset:0;background:#08090cbb;backdrop-filter:blur(10px);place-items:center;text-align:center}.win h1{font-size:46px;margin:4px}.win button{height:42px;padding:0 18px}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="brand">RICOCHETE</div><div class="sub">PROTÓTIPO 01 · FOLD SIMULATOR</div><div class="balls" id="balls">● ● ●</div><div class="tip">PUXA A BOLA PARA TRÁS E LARGA</div></div><div class="ctl"><label>DOBRA</label><input id="ang" type="range" min="70" max="180" value="100"><b><span id="av">100</span>°</b><button id="rst">RESET</button></div><div class="win" id="win"><div><div style="font-size:55px">💥</div><h1>BOOM!</h1><p>Torre abaixo.</p><button id="again">JOGAR OUTRA VEZ</button></div></div><script>
const c=document.querySelector('#c'),q=c.getContext('2d'),cl=(v,a,b)=>Math.max(a,Math.min(b,v));let W,H,D,hinge,fold=100,left=3,drag=false,shot=false,won=false,last=0,b={},bs=[],ps=[];
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;q.setTransform(D,0,0,D,0,0);hinge=H*.5;if(!shot)rb()}addEventListener('resize',size);
function rb(){b={x:W/2,y:H*.78,r:16,vx:0,vy:0,on:1};drag=shot=false}
function balls(){document.querySelector('#balls').textContent=[0,1,2].map(i=>i<left?'●':'○').join(' ')}
function build(){bs=[];ps=[];left=3;won=false;document.querySelector('#win').style.display='none';let bw=Math.min(47,W*.12),bh=25,y=hinge-23;for(let r=0;r<5;r++){let n=5-r;for(let i=0;i<n;i++)bs.push({x:W/2+(i-(n-1)/2)*(bw+3),y:y-r*(bh+3),w:bw,h:bh,vx:0,vy:0,a:0,va:0,hit:0})}rb();balls()}
function pos(e){return{x:e.clientX,y:e.clientY}}c.onpointerdown=e=>{if(shot||won)return;let p=pos(e);if(Math.hypot(p.x-b.x,p.y-b.y)<55){drag=1;c.setPointerCapture(e.pointerId)}};c.onpointermove=e=>{if(!drag)return;let p=pos(e);b.x=cl(p.x,W*.12,W*.88);b.y=cl(p.y,H*.67,H*.9)};c.onpointerup=e=>{if(!drag)return;drag=0;let hx=W/2,hy=H*.78,dx=hx-b.x,dy=hy-b.y,m=Math.hypot(dx,dy);if(m<18)return rb();let p=Math.min(m,180)*4.7;b.vx=dx/m*p;b.vy=dy/m*p;shot=1;left--;balls()};
function hit(o){let cx=cl(b.x,o.x-o.w/2,o.x+o.w/2),cy=cl(b.y,o.y-o.h/2,o.y+o.h/2),dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy);if(d<b.r){let nx=dx/(d||1),ny=dy/(d||1),dot=b.vx*nx+b.vy*ny;b.x+=nx*(b.r-d);b.y+=ny*(b.r-d);if(dot<0){b.vx-=1.72*dot*nx;b.vy-=1.72*dot*ny}return 1}}
function burst(x,y){for(let i=0;i<10;i++)ps.push({x,y,vx:(Math.random()-.5)*230,vy:(Math.random()-.5)*230,l:1})}
function step(dt){if(shot){b.vy+=710*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y>hinge-8&&b.y<hinge+18&&b.vy<0)b.vy-=130*(180-fold)/110;if(b.x-b.r<6){b.x=6+b.r;b.vx=Math.abs(b.vx)*.78}if(b.x+b.r>W-6){b.x=W-6-b.r;b.vx=-Math.abs(b.vx)*.78}if(b.y-b.r<65){b.y=65+b.r;b.vy=Math.abs(b.vy)*.7}for(let o of bs)if(!o.hit&&hit(o)){o.hit=1;o.vx=b.vx*.25+(Math.random()-.5)*70;o.vy=b.vy*.16-70;o.va=(Math.random()-.5)*5;burst(o.x,o.y)}if(b.y>H+70){shot=0;b.on=0;if(left)setTimeout(rb,180);else setTimeout(build,650)}}for(let o of bs)if(o.hit){o.vy+=510*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.a+=o.va*dt;if(o.y>H-80){o.y=H-80;o.vy*=-.25;o.vx*=.72}}for(let p of ps){p.vy+=390*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*1.8}ps=ps.filter(p=>p.l>0);if(!won&&bs.filter(o=>o.hit).length>=11){won=1;setTimeout(()=>document.querySelector('#win').style.display='grid',350)}}
function rr(x,y,w,h,r){q.beginPath();q.roundRect(x,y,w,h,r);q.fill()}
function draw(){let g=q.createLinearGradient(0,0,0,H);g.addColorStop(0,'#151923');g.addColorStop(.5,'#252936');g.addColorStop(.501,'#101216');g.addColorStop(1,'#191c22');q.fillStyle=g;q.fillRect(0,0,W,H);q.globalAlpha=.14;q.strokeStyle='white';for(let y=85;y<hinge;y+=34){q.beginPath();q.moveTo(10,y);q.lineTo(W-10,y);q.stroke()}for(let x=10;x<W;x+=34){q.beginPath();q.moveTo(x,75);q.lineTo(x,hinge);q.stroke()}q.globalAlpha=1;q.fillStyle='#050608';q.fillRect(0,hinge-5,W,10);q.strokeStyle='#ff645f';q.lineWidth=4;q.beginPath();q.arc(W/2,hinge*.36,32,0,7);q.stroke();q.beginPath();q.arc(W/2,hinge*.36,10,0,7);q.stroke();bs.forEach((o,i)=>{q.save();q.translate(o.x,o.y);q.rotate(o.a);q.fillStyle=i%3==0?'#ff8450':i%3==1?'#55a8ff':'#ffd05b';rr(-o.w/2,-o.h/2,o.w,o.h,6);q.restore()});ps.forEach(p=>{q.globalAlpha=p.l;q.fillStyle='#ffd98a';q.fillRect(p.x,p.y,4,4)});q.globalAlpha=1;if(drag){let dx=W/2-b.x,dy=H*.78-b.y,m=Math.hypot(dx,dy)||1,vx=dx/m*Math.min(m,180)*4.7,vy=dy/m*Math.min(m,180)*4.7;q.fillStyle='#ffffff70';for(let t=.08;t<.62;t+=.07){q.beginPath();q.arc(b.x+vx*t,b.y+vy*t+355*t*t,3,0,7);q.fill()}}if(b.on){let bg=q.createRadialGradient(b.x-6,b.y-7,2,b.x,b.y,b.r);bg.addColorStop(0,'#fff');bg.addColorStop(.22,'#ff776c');bg.addColorStop(1,'#981b19');q.fillStyle=bg;q.shadowColor='#ff4b3e';q.shadowBlur=18;q.beginPath();q.arc(b.x,b.y,b.r,0,7);q.fill();q.shadowBlur=0}}
function loop(t){let dt=Math.min((t-last)/1000||0,.025);last=t;step(dt);draw();requestAnimationFrame(loop)}document.querySelector('#ang').oninput=e=>{fold=+e.target.value;document.querySelector('#av').textContent=fold};document.querySelector('#rst').onclick=build;document.querySelector('#again').onclick=build;size();build();requestAnimationFrame(loop);
</script></body></html>
